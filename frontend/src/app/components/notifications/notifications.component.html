<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav
                 position="end"
                 [(opened)]="notificationService.isDrawerOpen$ | async"
                 mode="over"
                 fixedTopGap="64">
      <div class="notifications-header">
        <h3>Notifications</h3>
        <button mat-icon-button (click)="toggle()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
  </mat-sidenav>
</mat-sidenav-container>
