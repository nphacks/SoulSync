
<div class="profile-container">
    <!-- <h1>User Profile</h1> -->
    <button mat-raised-button color="primary" (click)="returnToMain()">Back to Main</button>
    <br><br>
    <div class="profile-grid">
      <!-- First Column -->
      <div class="column">
        <mat-card class="profile-card short-card">
          <mat-card-header>
            <mat-card-title>Basic Information</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p><strong>Name:</strong>Alice Cho</p>
            <p><strong>Email:</strong>alice&#64;gmail.com</p>
            <p><strong>Streak:</strong> 5 days</p>
            <mat-progress-bar mode="determinate" value="75"></mat-progress-bar>
          </mat-card-content>
        </mat-card>
  
        <mat-card class="profile-card tall-card">
          <mat-card-header>
            <mat-card-title>Settings</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div class="section">
                <h3>Therapist Information</h3>
                <p>Not therapist Assigned</p>
            </div>
            <div class="section">
                <h3>Privacy Settings</h3>
                
                <mat-slide-toggle [(ngModel)]="settings.sentimentShare" 
                                 (change)="onToggleChange('sentimentShare')">
                  Share Sentiment Analysis
                </mat-slide-toggle>
                <br><br>
                <mat-slide-toggle [(ngModel)]="settings.emotionShare" 
                                 (change)="onToggleChange('emotionShare')">
                  Share Emotion Tracking
                </mat-slide-toggle>
                <br><br>
                <mat-slide-toggle [(ngModel)]="settings.topicShare" 
                                 (change)="onToggleChange('topicShare')">
                  Share Topic Analysis
                </mat-slide-toggle>
                <br><br>
                <mat-slide-toggle [(ngModel)]="settings.summaryShare" 
                                 (change)="onToggleChange('summaryShare')">
                  Share Journal Summaries
                </mat-slide-toggle>
                <br><br>
                <mat-slide-toggle [(ngModel)]="settings.extremeEmotions" 
                                 (change)="onToggleChange('extremeEmotions')">
                  Alert for Extreme Emotions
                </mat-slide-toggle>
              </div>
            </mat-card-content>
        </mat-card>
      </div>
  
      <!-- Second Column -->
      <div class="column">
        <mat-card class="profile-card x-tall-card">
          <mat-card-header>
            <mat-card-title>Report</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <!-- Simple Dropdown Selector -->
            <select class="report-selector" [(ngModel)]="selectedReport">
              <option value="activity">Emotion Trend over time</option>
              <option value="mood">Most common emotions</option>
              <option value="goals">Journal entry per type</option>
              <option value="insights">Correleation between Sentiment and Emotion</option>
            </select>
            
            <!-- Dynamic Content -->
            <div *ngIf="selectedReport === 'activity'" class="report-content">
              <img src="../../../assets/1.png" width="100%">
            </div>
        
            <div *ngIf="selectedReport === 'mood'" class="report-content">
              <img src="../../../assets/2.png" width="100%">
            </div>
        
            <div *ngIf="selectedReport === 'goals'" class="report-content">
              <img src="../../../assets/3.png" width="100%">
            </div>
        
            <div *ngIf="selectedReport === 'insights'" class="report-content">
              <img src="../../../assets/4.png" width="100%">
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
