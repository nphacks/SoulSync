<mat-form-field class="example-full-width" style="width: 92%; height: 300px">
    <mat-label>Write your journal entry </mat-label>
    <textarea matInput placeholder="(max 300 words)" [formControl]="journalEntry" (input)="updateWordCount()" style="width: 100%; height: 250px"></textarea>
</mat-form-field>
<div class="word-count" [style.color]="wordCount > 300 ? 'red' : 'green'">
    {{ wordCount }}/300 words
</div>    
<button 
    [disabled]="wordCount > 300 || wordCount === 0"
    (click)="submitEntry()">
    Add Journal Entry
</button>
