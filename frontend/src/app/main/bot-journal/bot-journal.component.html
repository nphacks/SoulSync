<div class="chat-container">
  <mat-card class="chat-card">
    <mat-card-header>
      <mat-card-title>Helpful Assistant</mat-card-title>
      <mat-card-subtitle>Ask me anything</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="messages-container">
      <mat-list class="message-list">
        <!-- <mat-list-item *ngFor="let message of messages" 
               [class.user-message]="message.role === 'user'"
               [class.bot-message]="message.role === 'assistant'">
          <div class="message-content">
            <div class="message-header">
              <span class="message-role">{{ message.role | titlecase }}</span>
              <span class="message-time">{{ message.timestamp | date:'shortTime' }}</span>
            </div>
            <div class="message-text">
              {{ message.content }}
            </div>
          </div>
        </mat-list-item> -->
        <mat-list-item *ngFor="let message of messages" class="message-item">
          <div class="message-bubble" [class.user]="message.role === 'user'"
                                     [class.assistant]="message.role === 'assistant'">
            <div class="message-text">{{ message.content }}</div>
          </div>
        </mat-list-item>
        <mat-list-item *ngIf="isSending">
          <mat-spinner diameter="24"></mat-spinner>
          <span class="bot-typing">Assistant is typing...</span>
        </mat-list-item>
      </mat-list>
    </mat-card-content>

    <mat-card-actions class="input-area">
      <mat-form-field appearance="outline" class="message-input">
        <mat-label>Type your message</mat-label>
        <input matInput [formControl]="messageControl" (keyup.enter)="sendMessage()" placeholder="Ask me something...">
        <button mat-icon-button matSuffix (click)="sendMessage()" [disabled]="messageControl.invalid || isSending">
          <mat-icon>send</mat-icon>
        </button>
      </mat-form-field>
    </mat-card-actions>
  </mat-card>
  <div><button matButton (click)="addJournalEntry()">Add as Journal Entry</button></div>
</div>
